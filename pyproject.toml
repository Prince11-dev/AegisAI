[project]
name = "aegis-ai"
version = "0.1.0"
description = "Open Source Enterprise AI Platform"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name = "AegisAI Contributors"}
]

dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]